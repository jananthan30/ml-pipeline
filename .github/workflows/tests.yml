name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  hooks-stdlib:
    # The hooks must run on a bare python3 with no third-party packages.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Hook and canary tests (stdlib only)
        run: python -m unittest tests.test_guard_training tests.test_hook_data_work tests.test_gate_records tests.test_record_approval tests.test_post_tool_warn tests.test_session_start tests.test_mlpipeline_canary -v
      - name: Hook audit probe (must report 0 wrong)
        run: python tests/probe_hook_audit.py | tee probe.txt && grep -q "^0 of " probe.txt

  full:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev requirements
        run: python -m pip install -r tests/requirements-dev.txt
      - name: Run the full suite (includes the end-to-end and canary tests)
        run: python -m pytest tests -q
      - name: Installer smoke test
        run: |
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.codex"
          ./install-other-tools.sh
          test -f "$HOME/.codex/skills/ml-pipeline/lib/mlpipeline_guard.py"
          test -f "$HOME/.codex/skills/ml-pipeline/references/model-selection.md"
